name: Bug report
description: Something in the phytoworks SDK or the pws CLI does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste API keys, tokens or session files. Redact them first.
  - type: input
    id: version
    attributes:
      label: phytoworks version
      description: Output of `pws --version`.
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python and operating system
      placeholder: Python 3.12, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: The shortest commands or code that show the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
