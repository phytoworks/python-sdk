[project]
name = "phytoworks"
version = "0.1.3"
description = "PhytoWorks operator SDK and pws CLI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "PhytoWorks Team", email = "redtiger@phyto-works.com" }]
keywords = ["phytoworks", "operator", "sdk", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "httpx>=0.26.0",
  "jsonschema>=4.23.0",
  "pydantic>=2.12.0",
  "rich>=13.7.0",
  "typer>=0.18.0",
]

[project.optional-dependencies]
pandas = ["pandas>=2.3.3"]
zarr = ["zarr>=3.1.4,<4", "numpy>=2.3.2", "boto3>=1.35", "Pillow>=11.3"]
# Device.listen(): the MQTT receive loop for Hub capture commands.
device = ["paho-mqtt>=2.1,<3"]
dev = [
  "paho-mqtt>=2.1,<3",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.5",
  "pytest-cov>=5.0.0",
  "ruff>=0.3.0",
  "mypy>=1.12.0",
]

[project.scripts]
pws = "phytoworks.cli:main"
pws-console-read = "phytoworks._console_read:main"

[project.urls]
Documentation = "https://docs.phyto-works.com/guides/sdk-cli/quickstart"
Homepage = "https://phyto-works.com"
Source = "https://github.com/phytoworks/python-sdk"
Issues = "https://github.com/phytoworks/python-sdk/issues"

[build-system]
# Pinned: the manual PyPI publish rebuilds the tag and must match TestPyPI's digests byte for byte.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
  "/src/phytoworks",
  "/examples",
  "/README.md",
  "/CHANGELOG.md",
  "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
only-include = ["src/phytoworks"]
sources = ["src"]

# The examples stay at the package root (the public mirror's top level lists them, and ruff and mypy do not scan
# them) and install as package data at ``phytoworks/examples``. The directory has no ``__init__.py``.
[tool.hatch.build.targets.wheel.force-include]
"examples" = "phytoworks/examples"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "S", "C90"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# S105/S106: test fixtures carry placeholder session tokens, never real secrets.
"tests/**/*.py" = ["S101", "S105", "S106"]
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
